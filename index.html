<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NERVES - AI Logistics & Accessibility Platform</title>
    <meta name="description" content="AI-Powered Logistics & Accessibility Intelligence Platform for India's North Eastern Region (SIH26002). Predicting route accessibility, disruption risks, and supply continuity." />
    <meta property="og:title" content="NERVES - AI Logistics & Accessibility Platform" />
    <meta property="og:description" content="AI-Powered Logistics & Accessibility Intelligence Platform for India's North Eastern Region (SIH26002). Predicting route accessibility, disruption risks, and supply continuity." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nerves_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
